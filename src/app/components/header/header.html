<header class="app-header text-center py-4 position-relative">
    <button type="button" class="btn btn-sm btn-outline-secondary theme-toggle position-absolute top-0 end-0 m-3"
        (click)="themeService.toggle()"
        [attr.aria-label]="themeService.theme() === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro'"
        [title]="themeService.theme() === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro'">
        <i class="bi" [class.bi-sun]="themeService.theme() === 'dark'" [class.bi-moon-stars]="themeService.theme() === 'light'"></i>
    </button>
    <img class="profile-picture rounded-circle" ngSrc="./assets/profile.jpg" width="100" height="100" priority alt="Foto de Vinícius Gobbi">
    <p class="mt-2 mb-0 fs-5 fw-bold">Vinicgobbi</p>
</header>
